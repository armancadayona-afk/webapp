services:
  - type: web
    name: work-with-onthing
    runtime: node
    plan: starter
    buildCommand: npm ci || npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/onth.db
    disk:
      name: onthing-database
      mountPath: /var/data
      sizeGB: 1
